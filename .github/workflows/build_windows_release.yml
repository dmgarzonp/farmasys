name: Build & Release Multiplatform

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Crear Carpetas de Assets Requeridas
        run: |
          New-Item -ItemType Directory -Force -Path assets\icons
          New-Item -ItemType Directory -Force -Path assets\images

      - name: Instalar Dependencias de Flutter
        run: flutter pub get

      - name: Ejecutar Suite de Pruebas Automatizadas
        run: flutter test

      - name: Compilar Binario Release para Windows (con Ofuscación de Símbolos)
        run: flutter build windows --release --obfuscate --split-debug-info=build/windows/debug-info

      - name: Incluir Librerias Microsoft Visual C++ Runtime (VCRUNTIME / MSVCP)
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          Write-Host "Buscando librerias de tiempo de ejecucion C++ para $releaseDir..."
          $vsRedist = (Get-ChildItem -Path "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -ErrorAction SilentlyContinue | Select-Object -Last 1)
          if ($vsRedist -and (Test-Path $vsRedist.FullName)) {
            Write-Host "Copiando DLLs oficiales desde Visual Studio: $($vsRedist.FullName)"
            Copy-Item "$($vsRedist.FullName)\*.dll" -Destination $releaseDir -Force
          } else {
            Write-Host "Copiando DLLs desde C:\Windows\System32..."
            $dlls = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "msvcp140_codecvt_ids.dll")
            foreach ($dll in $dlls) {
              $src = "C:\Windows\System32\$dll"
              if (Test-Path $src) {
                Copy-Item $src -Destination $releaseDir -Force
                Write-Host "Copiada: $dll"
              }
            }
          }
          Get-ChildItem "$releaseDir\*.dll" | Select-Object Name

      - name: Compilar Instalador Oficial (.exe) con Inno Setup
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/farmsys_windows_setup.iss
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files\Inno Setup 6\ISCC.exe" installer/farmsys_windows_setup.iss
          } else {
            iscc installer/farmsys_windows_setup.iss
          }

      - name: Publicar Instalador Windows como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FarmSys-Windows-Installer
          path: installer/output/FarmSys_Setup_*.exe
          if-no-files-found: error

  build-linux:
    name: Compilar Linux (.deb y .tar.gz)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Instalar Dependencias del Sistema Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependencias de Flutter
        run: flutter pub get

      - name: Ejecutar Suite de Pruebas
        run: flutter test

      - name: Compilar Binario Release para Linux (con Ofuscación de Símbolos)
        run: flutter build linux --release --obfuscate --split-debug-info=build/linux/debug-info

      - name: Generar Paquetes Instalador (.deb y .tar.gz)
        run: |
          chmod +x installer/build_linux_deb.sh installer/build_linux_package.sh
          ./installer/build_linux_deb.sh
          ./installer/build_linux_package.sh

      - name: Publicar Instaladores Linux como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FarmSys-Linux-Installers
          path: |
            installer/output/farmsys_*_amd64.deb
            installer/output/FarmSys_Linux_x64_*.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publicar GitHub Release Oficial
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Descargar Artefacto Windows
        uses: actions/download-artifact@v4
        with:
          name: FarmSys-Windows-Installer
          path: release-assets

      - name: Descargar Artefactos Linux
        uses: actions/download-artifact@v4
        with:
          name: FarmSys-Linux-Installers
          path: release-assets

      - name: Crear GitHub Release Oficial
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: "FarmSys ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
